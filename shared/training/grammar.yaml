# Routing training grammar (round 3). Written from the catalog (agent and tool descriptions, tool
# hints) as a model-free fallback after the generation budget was spent (see
# docs/decisions/0017-round-2-3-router-and-guardrails.md). `atrium train-router` expands each template
# with a fixed seed, adds the knowledge base's own FAQ questions and the catalog examples, applies
# writing noise (no accents, chat abbreviations, typos, greetings, context before the question),
# drops anything whose token overlap with an evaluation question reaches 0.6, and trains on the
# rest. Syntax: (a|b|c) one of; [x] optional; {slot} a slot below. Nothing here is copied from an
# evaluation set; the guard checks it on every training run.
slots:
  ferias: [férias, ferias]
  quero: [quero, queria, preciso, gostaria de, tô querendo, to precisando]
  ver: [ver, saber, consultar, conferir, checar, olhar]
  mostra: [me mostra, me manda, me passa, mostra, manda, traz, me diz]
  quanto: [quanto, qto, quantos, qtos]
  mes: [janeiro, fevereiro, março, abril, maio, junho, julho, agosto, setembro, outubro, novembro, dezembro]
  quando: [quando, qnd, que dia, em que data]
  time: [meu time, minha equipe, meu pessoal, a galera do time, os meus liderados, a equipe]
  colega: [Tiago, Camila, Isabela, Luana, Igor, Sofia, Tatiane]
  area: [Tecnologia, Plataforma de Dados, Engenharia de Produto, Financeiro, Comercial, Atendimento, Operações, Pessoas]
agents:
  vacation:
    - "[me diz ]{quanto} dias de {ferias} (eu tenho|ainda tenho|me restam|sobrou pra mim|tenho disponível)"
    - "(qual|como tá|como esta) (o meu|meu) saldo de {ferias}"
    - "(minhas|as minhas) {ferias} (vencem|vão vencer|expiram) {quando}"
    - "(tenho|tô com) {ferias} (vencendo|pra vencer|acumuladas)[?]"
    - "(corro|tô correndo) risco de (pagar|tirar) {ferias} em dobro"
    - "até {quando} (posso|preciso) (usar|gozar|tirar) (as minhas|minhas) {ferias}"
    - "(quais|quantos) (são os|os) feriados (desse ano|de 2027|do próximo ano|que faltam)"
    - "tem feriado (em|no mês de) {mes}[?]"
    - "(qual|quais) (a melhor|as melhores) (data|datas|época) (pra|para) (tirar|marcar) {ferias}"
    - "(dá pra|como faço pra|quero) (emendar|juntar) (feriado|o feriado|feriados) com {ferias}"
    - "(me sugere|sugere|me ajuda a escolher) (uma janela|um período|datas) (de|pra) {ferias} (em|no) {mes}"
    - "{quero} (tirar|marcar|agendar|pedir) {ferias} (em|no começo de|no fim de) {mes}"
    - "{quero} (tirar|marcar) {ferias} (de|do dia) (5|10|12|20) (a|até) (15|19|24|30) de {mes}"
    - "(vou|pretendo) (sair de|tirar) {ferias} (em|lá pra) {mes}, (como faço|pode marcar|dá certo)[?]"
    - "(quanto|qto) (vou receber|recebo|cai) (nas|de) {ferias} (se tirar|tirando) (15|20|30) dias"
    - "(posso|dá pra|quero) vender (10 dias|um terço|parte) (das|das minhas) {ferias}"
    - "(simula|faz uma simulação d)(o valor|as) {ferias} (com|sem) abono"
    - "(como tá|qual o status do|aprovaram o) (meu|o meu) pedido de {ferias}"
    - "(meus|quais meus) pedidos de {ferias} (abertos|pendentes|em análise)"
    - "{quero} cancelar (o meu|meu) pedido de {ferias}"
    - "(desisti das|não vou mais tirar as) {ferias} de {mes}, (cancela|como cancelo)[?]"
    - "(tenho direito a|quantos dias de) licença (paternidade|maternidade|casamento|nojo|por luto)"
    - "(como funciona|qual a regra|o que diz a política) (de|da|das) {ferias}"
    - "(posso|é permitido) (dividir|fracionar) {ferias} em (2|3|dois|três) períodos"
    - "{ferias} (podem|pode) começar (na sexta|numa sexta-feira|antes de feriado)[?]"
    - "(com quanto tempo de antecedência|quantos dias antes) (preciso|tenho que) (pedir|avisar) {ferias}"
    - "(recesso de fim de ano|recesso) conta como {ferias}[?]"
