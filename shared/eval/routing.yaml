  - {persona: colaborador, q: "Quero trocar minha conta bancária", expect: profile}
  - {persona: colaborador, q: "Como incluo minha esposa como dependente no imposto de renda?", expect: profile}
  - {persona: colaborador, q: "Tenho algum treinamento obrigatório pendente?", expect: career}
  - {persona: colaborador, q: "Quando é a autoavaliação do ciclo de desempenho?", expect: career}
  - {persona: colaborador, q: "Tem vaga interna para o meu perfil?", expect: career}
  - {persona: colaborador, q: "Quantos dias preciso ir ao escritório no trabalho híbrido?", expect: compliance}
  - {persona: colaborador, q: "Posso aceitar um brinde de fornecedor?", expect: compliance}
