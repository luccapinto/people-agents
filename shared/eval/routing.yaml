  - {persona: colaborador, q: "Meu filho nasceu ontem", expect: "life_event:birth"}
  - {persona: colaborador, q: "Me casei no sábado!", expect: "life_event:marriage"}
  - {persona: colaborador, q: "Quantos dias de férias eu tenho e quando cai o 13º?", expect: [vacation, payroll]}
  - {persona: novata, q: "Comecei semana passada, o que preciso fazer?", expect: onboarding}
