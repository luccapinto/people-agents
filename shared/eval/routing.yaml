  - {persona: colaborador, q: "Como funciona a coparticipação do convênio?", expect: benefits}
  - {persona: colaborador, q: "Quero pedir reembolso do táxi da viagem a trabalho", expect: reimbursement}
  - {persona: colaborador, q: "Meu reembolso já foi pago?", expect: reimbursement}
  - {persona: colaborador, q: "Qual o limite de reembolso de hotel?", expect: reimbursement}
  - {persona: colaborador, q: "Quanto tenho de banco de horas?", expect: timekeeping}
