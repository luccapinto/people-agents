# Routing evaluation set — HELD OUT. Written as paraphrases (colloquial, missing accents,
# typos, indirect and mixed intent); `tests/runtime/test_routing_eval.py` enforces that no
# question has token Jaccard >= 0.6 with any routing example in shared/catalog/agents.yaml.
# Do not tune routing profiles against these questions: write a new held-out set instead.
#
# expect: an agent id; a list (all must be routed); "life_event:<key>"; or "not:<agent>"
# (the agent is invisible to the persona and must not be chosen).
# Run by the back-end (pytest) and replayed by the demo engine through goldens.
questions:
  # Férias e Ausências
  - {persona: colaborador, q: "to precisando descansar, quantos dias de ferias ainda sobram pra mim?", expect: vacation}
  - {persona: colaborador, q: "tem algum feriadao bom no comeco do ano que eu consiga juntar com folga?", expect: vacation}
  - {persona: colaborador, q: "da pra marcar minhas ferias comecando 7 de dezembro, umas duas semanas?", expect: vacation}
  - {persona: colaborador, q: "se eu nao tirar as ferias logo eu perco alguma coisa?", expect: vacation}
  - {persona: colaborador, q: "quais datas sao feriado em SP no ano que vem", expect: vacation}
  - {persona: colaborador, q: "posso transformar parte das ferias em dinheiro?", expect: vacation}
  - {persona: colaborador, q: "quero desistir do pedido FER-00042", expect: vacation}
  - {persona: colaborador, q: "quanto cai na conta quando eu sair 15 dias de ferias?", expect: vacation}
  # Remuneração e Folha
  - {persona: colaborador, q: "meu contracheque do mes passado ta estranho, me mostra", expect: payroll}
  - {persona: colaborador, q: "somando tudo, quanto entra pra mim em 2026?", expect: payroll}
  - {persona: colaborador, q: "vale a pena fazer previdencia privada pra pagar menos IR?", expect: payroll}
  - {persona: colaborador, q: "por que descontaram tanto imposto do meu salario?", expect: payroll}
  - {persona: colaborador, q: "se eu fosse promovido pra 14 mil quanto sobraria liquido?", expect: payroll}
  - {persona: colaborador, q: "a participacao nos lucros cai quando?", expect: payroll}
  - {persona: colaborador, q: "quando recebo a segunda parcela do decimo terceiro?", expect: payroll}
  # Benefícios
  - {persona: colaborador, q: "meu convenio medico e qual mesmo e quanto pago por ele?", expect: benefits}
  - {persona: colaborador, q: "o premium compensa pra quem tem uma dependente no plano?", expect: benefits}
  - {persona: colaborador, q: "minha filha vai entrar na creche, a empresa ajuda?", expect: benefits}
  - {persona: colaborador, q: "qto eu tenho de VA e VR?", expect: benefits}
  - {persona: colaborador, q: "se eu for numa consulta pago alguma coisa a mais no plano?", expect: benefits}
  # Reembolsos e Despesas
  - {persona: colaborador, q: "paguei um uber pra visitar o cliente, como recebo esse dinheiro de volta?", expect: reimbursement}
  - {persona: colaborador, q: "o dinheiro do hotel da viagem ja caiu?", expect: reimbursement}
  - {persona: colaborador, q: "ate quanto a empresa banca de diaria numa viagem a trabalho?", expect: reimbursement}
  # Ponto e Jornada
  - {persona: colaborador, q: "fiquei devendo horas ou tenho saldo positivo?", expect: timekeeping}
  - {persona: colaborador, q: "nao registrei minha entrada hoje cedo, cheguei 9h", expect: timekeeping}
  - {persona: colaborador, q: "quantas horas a mais eu trabalhei em setembro", expect: timekeeping}
  # Documentos e Declarações
  - {persona: colaborador, q: "o banco pediu um papel provando que eu trabalho ai", expect: documents}
  - {persona: colaborador, q: "preciso do comprovante de rendimentos pra fazer a declaracao do IR", expect: documents}
  - {persona: colaborador, q: "vou viajar pro Canada e o consulado quer uma carta da empresa", expect: documents}
  # Dados Cadastrais
  - {persona: colaborador, q: "abri conta num banco novo e quero receber o salario nela", expect: profile}
  - {persona: colaborador, q: "me mudei pra Pinheiros, onde atualizo isso?", expect: profile}
  - {persona: colaborador, q: "como coloco minha mae como dependente?", expect: profile}
  # Carreira e Desenvolvimento
  - {persona: colaborador, q: "tem algum curso que eu sou obrigado a fazer ainda?", expect: career}
  - {persona: colaborador, q: "qual o prazo pra entregar minha auto avaliacao?", expect: career}
  - {persona: colaborador, q: "quero mudar de area dentro da empresa, tem oportunidade aberta?", expect: career}
  - {persona: colaborador, q: "que trilhas de aprendizado existem pra quem quer virar lider?", expect: career}
  # Políticas e Compliance
  - {persona: colaborador, q: "sou obrigado a ir no escritorio toda semana?", expect: compliance}
  - {persona: colaborador, q: "um fornecedor me ofereceu ingresso pra um show, posso aceitar?", expect: compliance}
  - {persona: colaborador, q: "como a empresa trata meus dados pessoais segundo a lei?", expect: compliance}
  - {persona: colaborador, q: "posso usar o chatgpt com dados de cliente?", expect: compliance}
  # Plataforma de Dados (Studio agent, unit U11)
  - {persona: colaborador, q: "como devo nomear um model intermediario no dbt?", expect: data_platform}
  - {persona: colaborador, q: "minha dag falhou de madrugada, quantas tentativas eu configuro?", expect: data_platform}
  - {persona: colaborador, q: "preciso ler uma tabela com dado restrito, qual o fluxo de liberacao?", expect: data_platform}
  - {persona: novata, q: "como devo nomear um model intermediario no dbt?", expect: "not:data_platform"}
  # Concierge
  - {persona: colaborador, q: "bom dia!", expect: concierge}
  - {persona: colaborador, q: "me ajuda a escrever um email agradecendo o time pelo projeto", expect: concierge}
  - {persona: colaborador, q: "o que da pra resolver por aqui?", expect: concierge}
  # Onboarding (new hire)
  - {persona: novata, q: "sou nova aqui, quais sao minhas proximas tarefas de integracao?", expect: onboarding}
  - {persona: novata, q: "quem vai me acompanhar nas primeiras semanas?", expect: onboarding}
  - {persona: novata, q: "ainda nao tenho login em algumas ferramentas, o que falta liberar?", expect: onboarding}
  # Liderança (manager)
  - {persona: gestora, q: "alguem da minha equipe ta precisando tirar ferias urgente?", expect: leadership}
  - {persona: gestora, q: "tem pedido de folga esperando eu dar ok?", expect: leadership}
  - {persona: gestora, q: "quem do time ta fazendo hora extra demais?", expect: leadership}
  - {persona: gestora, q: "recusar o pedido FER-00204", expect: leadership}
  # People Analytics (HRBP) and its invisibility for others
  - {persona: hrbp, q: "quantos funcionarios a Tecnologia tem hoje, quebrando por time?", expect: people_analytics}
  - {persona: hrbp, q: "qual foi a taxa de desligamentos da area no ultimo ano?", expect: people_analytics}
  - {persona: hrbp, q: "como andam as faltas e atestados por area?", expect: people_analytics}
  - {persona: colaborador, q: "qual a rotatividade da Tecnologia?", expect: "not:people_analytics"}
  # Life events
  - {persona: colaborador, q: "minha esposa deu a luz hoje de manha", expect: "life_event:birth"}
  - {persona: colaborador, q: "fiquei noivo e o casamento e mes que vem", expect: "life_event:marriage"}
  - {persona: colaborador, q: "mudei de ape semana passada", expect: "life_event:address_change"}
  # Mixed intent
  - {persona: colaborador, q: "quanto tenho de saldo de ferias e quando cai a PLR?", expect: [vacation, payroll]}
  - {persona: colaborador, q: "preciso da declaracao de vinculo e tambem quero ver meu banco de horas", expect: [documents, timekeeping]}
  # Governance persona
  - {persona: governanca, q: "quais sao as regras para usar inteligencia artificial no trabalho?", expect: compliance}
