# Routing evaluation set. Run by the back-end (pytest) and by the demo engine (Vitest).
# expect: one agent id, a list (all must be routed), or "life_event:<key>".
# persona: which fictional persona asks (audience filters apply).
questions:
  - {persona: colaborador, q: "Quantos dias de férias eu tenho?", expect: vacation}
  - {persona: colaborador, q: "qual a melhor data pra emendar feriado e descansar mais?", expect: vacation}
  - {persona: colaborador, q: "Quero tirar férias de 23/11 a 07/12", expect: vacation}
  - {persona: colaborador, q: "Minhas férias estão vencendo?", expect: vacation}
  - {persona: colaborador, q: "Quais são os feriados de 2027?", expect: vacation}
  - {persona: colaborador, q: "Posso vender 10 dias das minhas ferias?", expect: vacation}
  - {persona: colaborador, q: "Quero cancelar o pedido FER-00042", expect: vacation}
  - {persona: colaborador, q: "Me mostra meu holerite de setembro", expect: payroll}
  - {persona: colaborador, q: "Quanto vou receber este ano?", expect: payroll}
  - {persona: colaborador, q: "Quanto valeria eu colocar em PGBL dado meu salário?", expect: payroll}
  - {persona: colaborador, q: "por que o desconto de inss veio desse valor?", expect: payroll}
  - {persona: colaborador, q: "Se eu ganhasse 12 mil, quanto seria o líquido?", expect: payroll}
  - {persona: colaborador, q: "Quando cai a PLR?", expect: payroll}
  - {persona: colaborador, q: "Qual é o meu plano de saúde?", expect: benefits}
  - {persona: colaborador, q: "Vale a pena trocar para o Vitalis Plus?", expect: benefits}
