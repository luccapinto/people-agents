# Routing evaluation set — BLIND 2. Written on 2026-10-01 at the start of round 3, before any
# round-3 routing change (training data, classifier, rules), and committed on its own. It is
# measured, never tuned against: its misses are printed only when ATRIUM_SHOW_BLIND2_MISSES=1,
# and STATUS.md records how many times they were looked at.
#
# Five personas, informal Portuguese, missing accents, typos, long messages. `governance` is the
# governance agent added in round 3 (Carlos only). Third-party questions are not here: they are
# decided before routing (shared/eval/subject.yaml).
