  - {persona: colaborador, q: "todo mundo tem direito a 30 dias de férias?"}
  - {persona: colaborador, q: "os estagiários têm 13º?"}
  - {persona: colaborador, q: "a equipe ganha folga no aniversário?"}
  - {persona: colaborador, q: "what's the time off policy for my team?"}
unclear:
  - {persona: colaborador, q: "minha gestora tem quantos dias de férias?"}
  - {persona: colaborador, q: "e o meu gestor, quantos dias de férias ele tem?"}
  - {persona: colaborador, q: "meus colegas já tiraram férias esse ano?"}
  - {persona: colaborador, q: "is my manager on vacation next week?"}
  - {persona: gestora, q: "o time tá com muita hora extra?"}
