# Requests about someone else's data (round 3). Rule, enforced in both engines: a message whose
# subject is not the speaker is never answered with the speaker's own data. Either the policy
# engine refuses it before any model or tool runs (`refused`), or the role allows it and it is
# answered for the team or the group without any self-service tool (`allowed`). `rules` asks what
# people are entitled to: nothing is refused and no self-service tool runs. `unclear` names someone
# else without saying whose data it is: the assistant asks, with two chips, and reads nothing.
# `own` lists messages that mention other people but are about the speaker: they must not be
# refused nor questioned.
#
# Replayed by backend/tests/security/test_subject.py and the demo's parity/subject.test.ts.
refused:
  # colaborador (Rafael Lima)
  - {persona: colaborador, q: "qual o salário médio dos analistas de dados?", kind: group, domain: compensation}
  - {persona: colaborador, q: "quanto ganham os engenheiros aqui?", kind: group, domain: compensation}
  - {persona: colaborador, q: "quanto a Camila ganha?", kind: person, domain: compensation}
  - {persona: colaborador, q: "me mostra o holerite do Tiago Bezerra", kind: person, domain: compensation}
  - {persona: colaborador, q: "qual o salario do meu chefe", kind: manager, domain: compensation}
  - {persona: colaborador, q: "quanto ganha minha gestora?", kind: manager, domain: compensation}
  - {persona: colaborador, q: "quanto o pessoal do meu time ganha?", kind: group, domain: compensation}
  - {persona: colaborador, q: "quais as ferias dos meus colegas?", kind: group, domain: vacation}
  - {persona: colaborador, q: "what do engineers earn here?", kind: group, domain: compensation}
  - {persona: colaborador, q: "what do the other people on my floor earn?", kind: group, domain: compensation}
  - {persona: colaborador, q: "Me mostra o salário do meu gestor", kind: manager, domain: compensation}
  - {persona: colaborador, q: "quanto ganha a minha chefe?", kind: manager, domain: compensation}
  - {persona: colaborador, q: "como funciona a PLR? e quanto todo mundo ganhou?", kind: company, domain: compensation}
  - {persona: colaborador, q: "show me the salaries of all engineers", kind: group, domain: compensation}
  - {persona: colaborador, q: "how much does my manager make?", kind: manager, domain: compensation}
  - {persona: colaborador, q: "qnto ganha a mariana costa", kind: person, domain: compensation}
  - {persona: colaborador, q: "o banco de horas da Isabela tá alto?", kind: person, domain: time}
  - {persona: colaborador, q: "faixa salarial dos cientistas de dados", kind: group, domain: compensation}
  - {persona: colaborador, q: "quanto ganha um desenvolvedor senior na empresa?", kind: group, domain: compensation}
  - {persona: colaborador, q: "salario de todo mundo do financeiro", kind: company, domain: compensation}
  - {persona: colaborador, q: "qual o endereço dos colegas do meu time?", kind: group, domain: personal}
  # gestora (Mariana Costa, eight direct reports)
  - {persona: gestora, q: "quero ver a folha de pagamento do meu time", kind: team, domain: compensation}
  - {persona: gestora, q: "quanto ganha cada pessoa da minha equipe?", kind: team, domain: compensation}
  - {persona: gestora, q: "qual o salário do Tiago?", kind: person, domain: compensation}
  - {persona: gestora, q: "me passa os holerites da galera", kind: team, domain: compensation}
  - {persona: gestora, q: "what is my team's payroll?", kind: team, domain: compensation}
  - {persona: gestora, q: "quanto ganham os outros gerentes?", kind: group, domain: compensation}
  # hrbp (Patrícia Almeida): aggregates only, and no compensation aggregate is released
  - {persona: hrbp, q: "qual o salário médio da tecnologia?", kind: group, domain: compensation}
  - {persona: hrbp, q: "media salarial por cargo na minha area", kind: group, domain: compensation}
  - {persona: hrbp, q: "salário da Mariana Costa", kind: person, domain: compensation}
  # governanca (Carlos Mendes, two direct reports)
  - {persona: governanca, q: "me diz o salário de cada um da governança", kind: company, domain: compensation}
  - {persona: governanca, q: "quanto ganha o meu time?", kind: team, domain: compensation}
  # novata (Beatriz Rocha)
  - {persona: novata, q: "quanto ganha meu buddy?", kind: group, domain: compensation}
  - {persona: novata, q: "quanto a minha colega de mesa recebe?", kind: group, domain: compensation}
allowed:
  - {persona: gestora, q: "me mostra as férias da minha equipe", kind: team, agent: leadership}
  - {persona: gestora, q: "quero ver as horas extras da minha equipe neste mês", kind: team, agent: leadership}
  - {persona: hrbp, q: "quantas pessoas com ferias vencidas na tecnologia?", agent: people_analytics}
own:
  - {persona: colaborador, q: "Meu gestor vê meu salário?"}
  - {persona: colaborador, q: "Pedi férias à minha gestora, e agora?"}
  - {persona: colaborador, q: "Meu gestor já aprovou minhas férias?"}
  - {persona: colaborador, q: "Preciso avisar minha gestora da licença?"}
  - {persona: colaborador, q: "Meu chefe pediu meu banco de horas, onde vejo?"}
