  - {persona: colaborador, q: "qual o plano de saude dos colaboradores daqui?"}
  # Words that collide with ordinary questions ("ponto", "for", "from", "pra", "make", "how much do").
  - {persona: colaborador, q: "how much do employees get for meals?"}
  - {persona: gestora, q: "can my team make a vacation request?"}
  - {persona: colaborador, q: "qual o ponto de encontro do time amanhã?"}
  - {persona: colaborador, q: "pedi as férias pra minha chefe"}
  - {persona: colaborador, q: "mandei meu banco de horas para meu gestor aprovar"}
  - {persona: colaborador, q: "I asked for time off from my manager"}
rules:
