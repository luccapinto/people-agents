# Domain vocabulary for the deterministic router and the deterministic model (both engines).
# Each variant is replaced by its canonical term before scoring, so routing profiles and tool
# hints only need the canonical words. Matching is accent- and plural-insensitive.
#
# Rules (enforced by tests/runtime/test_routing_eval.py): short domain synonyms only, at most
# two content words per variant, nothing copied from an evaluation question. A phrase that
# only fixes one test question does not belong here.

synonyms:
  holerite: [contracheque, payslip]
  salario: [remuneracao, ordenado, salary]
  pgbl: [previdencia privada, previdencia complementar]
  decimo terceiro: [13o, gratificacao natalina]
  plr: [participacao nos lucros, bonus anual]
  hora extra: [horas a mais, overtime]
  plano de saude: [convenio, plano medico, assistencia medica]
  odonto: [dentista, odontologico, dentario]
  reembolso: [ressarcimento, ressarcir]
  hospedagem: [diaria, pernoite]
  comprovante: [nota fiscal, cupom fiscal]
  conta bancaria: [conta no banco]
  apartamento: [ape]
  treinamento: [capacitacao]
  lgpd: [protecao de dados]
  aprovar: [aval, autorizar]
  receber: [entra]

# Phrases that mean "the person speaking must decide" (manager approvals).
approval_by_me: [esperando eu, aguardando eu, eu aprovar, eu aprovo, minha aprovacao, pra eu aprovar, para eu aprovar, eu decidir]

# References to the manager's team ("eles", "minha equipe"): only meaningful when the
# Liderança agent is visible, i.e. for managers.
team_reference: [eles, elas, deles, delas, meu time, minha equipe, meus colaboradores, meus liderados, o time, a equipe]

# Generic containers: "o documento do meu holerite" is about the payslip, not about documents.
containers: [documento, papel, arquivo, pdf]

# General-purpose requests (no HR system involved): the Concierge answers them with the
# governed model, or explains honestly that no model is connected.
general:
  redacao: [escrever, escreva, escreve, redigir, redija, rascunho, rascunhar, elabore, write, draft]
  traducao: [traduz, traduza, traduzir, traducao, translate, em ingles, para o ingles, em espanhol]
  resumo: [resuma, resumir, sintetize, summarize]
  revisao: [revise o texto, corrija o texto, melhore o texto, corrigir a gramatica]
  codigo: [python, javascript, typescript, codigo em, um script, regex, expressao regular]
  conhecimento geral: [previsao do tempo, vai chover, receita de, quem ganhou, capital do, capital da, cotacao do dolar, horoscopo, piada, quem descobriu, quem inventou]

# Whose data a message asks for (runtime/subject.py and its TS port). Matching is on folded word
# sequences. A domain word only counts for someone else when it is attached to them ("salário
# do meu gestor", "folha de pagamento do time", "salário médio dos analistas", "every salary"):
# "meu gestor vê meu salário?" and "pedi férias à minha gestora" stay about the speaker.
subjects:
  domains:
    compensation: [salario, salarios, holerite, holerites, contracheque, contracheques, remuneracao, remuneracoes, folha de pagamento,
                   plr, bonus, decimo terceiro, 13o, quanto ganha, quanto ganham, quanto recebe, quanto recebem,
                   salary, salaries, payslip, payslips, payroll, paycheck, paychecks, wage, wages, compensation]
    vacation: [ferias, folga, folgas, licenca, licencas, vacation, vacations, time off, pto]
    # Not bare "ponto" ("ponto de encontro") nor bare "folha" ("folha de ponto" is time data).
    time: [banco de horas, hora extra, horas extras, bater ponto, bater o ponto, registro de ponto, marcacao de ponto,
           marcacoes de ponto, folha de ponto, espelho de ponto, overtime, timesheet]
    personal: [cpf, endereco, telefone, conta bancaria, avaliacao de desempenho, nota da avaliacao, address, phone number,
               bank account, performance review]
  # Personal words that only count for a named person or the manager ("o plano de saúde dos
  # colaboradores" asks what the company offers).
  person_only: [plano de saude, dependentes, dependente, pagamento, health plan]
  self_possessive: [meu, minha, meus, minhas, my, mine]
  # A third-person pay verb: "meu chefe ganha bem?", "what do the other people on my floor earn?"
  # ("recebe" and "make" are too generic alone: "todo mundo recebe vale?", "my team will make the deadline").
  money_verbs: [ganha, ganham, ganhou, ganharam, earn, earns, earned]
  # Pay verbs only after a pay question: "quanto a minha colega recebe?", "how much does my manager make?".
  pay_questions: [quanto, quanta, how much, what]
  question_pay_verbs: [recebe, recebem, recebeu, receberam, leva, levam, make, makes, made, paid]
  # Whose data: genitive links only ("as férias da minha gestora"). "Pedi as férias pra minha chefe"
  # and "time off from my manager" stay the speaker's.
  links: [do, da, dos, das, de, of]
  # Also for a group or an aggregate: "salário médio para engenheiros", "average salary for analysts".
  group_links: [para, pra, entre, among, for]
  articles: [o, a, os, as, um, uma, the, an, cada, each]
  # Words that may sit between a domain word and its people: "as férias dos meus colegas",
  # "the salaries of all engineers".
  fillers: [meu, minha, meus, minhas, seu, sua, seus, suas, nosso, nossa, nossos, nossas, all, todos, todas, outros, outras, other, every]
  manager: [meu gestor, minha gestora, meu chefe, minha chefe, meu lider, minha lider, meu superior, minha superior, meu coordenador,
            minha coordenadora, my manager, my boss, my supervisor, my lead]
  team: [meu time, minha equipe, meu pessoal, minha galera, minha turma, meus liderados, minhas lideradas, meus subordinados,
         meus colaboradores, meu setor, o time, a equipe, o pessoal, a galera, time, equipe, galera, time inteiro, equipe toda,
         equipe inteira, my team, the team, team, my reports, my direct reports, deles, delas]
  group: [colegas, colega, buddy, padrinho, madrinha, outros, outras pessoas, os outros, pessoas, funcionarios, colaboradores, empregados,
          engenheiros, engenheiras,
          analistas, desenvolvedores, desenvolvedoras, devs, gerentes, gestores, diretores, diretoras, cientistas, estagiarios,
          coordenadores, lideres, cargo, cargos, area, areas, setor, setores, departamento, departamentos, unidade, unidades,
          tecnologia, financeiro, comercial, juridico, vendas, rh, marketing, operacoes, atendimento, engenharia, produto, governanca,
          infraestrutura, contabilidade, diretoria, presidencia, colleagues, coworkers, engineers, developers, managers, analysts,
          people, staff, employees, others, other people, department, departments, roles]
  role: [desenvolvedor, desenvolvedora, engenheiro, engenheira, analista, gerente, cientista, estagiario, estagiaria, diretor, diretora,
         coordenador, coordenadora, designer, developer, engineer, analyst, manager]
  aggregate: [salario medio, salarios medios, media salarial, media de salario, media dos salarios, faixa salarial, teto salarial,
              piso salarial, average salary, median salary, salary range, pay range, salary band, salary bands]
  company: [todo mundo, todos os funcionarios, todos os colaboradores, todos os empregados, todas as pessoas, todo o pessoal,
            toda a empresa, empresa toda, empresa inteira, cada um, cada uma, cada pessoa, cada funcionario, cada colaborador, de todos,
            todos os salarios, todos os holerites, everyone, everybody, everyones, every salary, every employee, every payslip,
            all employees, all staff, all salaries, all the salaries, all payslips, whole company, each employee, each person]
  # "todos os meses", "every month": a quantifier over time, not over people.
  time_words: [mes, meses, ano, anos, dia, dias, semana, semanas, periodo, periodos, month, months, year, years, week, weeks]
  # Questions about the rules, not about anyone's data ("como funciona o banco de horas da equipe?"),
  # checked in the same sentence as the people they mention.
  rule_cues: [por lei, tem direito, temos direito, direito, como funciona, qual a regra, quais as regras, regra, regras, norma, normas,
              politica, qual a politica, e permitido, quando cai, quando e pago, que dia, data de pagamento, dia do pagamento,
              how does, what is the policy, policy, rules, entitled, when is]
  # "os estagiários têm 13º?", "a equipe ganha folga no aniversário?": what a group is entitled to.
  entitlement_verbs: [tem, ganha, ganham, recebe, recebem, has, have, get, gets]
  # Someone other than the speaker acts in the sentence ("minha gestora tem quantos dias de férias?").
  # With a domain word that belongs to nobody in particular, the assistant asks whose data it is.
  third_person: [ele, ela, eles, elas, dele, dela, tem, tira, tiram, tirou, tiraram, pega, pegou, pegaram, marcou, marcaram,
                 pediu, pediram, esta, estao, ta, tao, anda, andam, vai, vao, he, she, they, his, her, their, them, has, takes,
                 took, gets, got, is, are, was, were]
  # The speaker acts in the sentence: "minha gestora pediu que eu tirasse férias" is about the speaker.
  first_person: [eu, i, me, mim, comigo]
  # Bare reference words that take "da"/"das" in a chip ("Hora extra da equipe").
  feminine: [equipe, galera, turma, empresa, area, areas, diretoria, presidencia, unidade, unidades, contabilidade, engenharia,
             infraestrutura, tecnologia, governanca, pessoas, outras, gestora, gestoras, diretoras, engenheiras, desenvolvedoras]
