# Governed tool catalog. Every tool an agent can use is listed here with its risk level.
# risk: read | write | sensitive. write/sensitive tools never execute in the model loop:
# they create a proposal that the user confirms (sensitive also requires step-up).
# subject: self (no subject parameter: the authenticated person) | target (a colleague,
# authorized by the policy engine) | none (catalog or knowledge, no personal data).
# hints: words used by the deterministic router/fake model to pick the tool.

kb_search:
  title: Buscar na base de conhecimento
  description: Busca trechos das políticas e documentos da empresa nas bases de conhecimento deste agente. Use para perguntas sobre regras, políticas e procedimentos. Sempre cite a fonte.
  risk: read
  subject: none
  hints: [política, regra, como funciona, posso, pode, quando, prazo, procedimento, documento, norma, direito]
ticket_open:
  title: Abrir chamado para atendimento humano
  description: Abre um chamado para o time responsável quando o assistente não consegue resolver. Cria uma proposta que a pessoa precisa confirmar.
  risk: write
  subject: self
  hints: [chamado, falar com alguém, atendente, humano, abrir ticket, suporte, ajuda humana]

