[project]
name = "atrium"
version = "0.1.0"
description = "A governed conversational front door for employee services: identity-bound agents, deterministic HR calculators, auditable governance."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
    "weasyprint>=63",
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.8"]

[project.scripts]
atrium = "atrium.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atrium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: requires the Postgres test database",
    "security: adversarial security scenarios",
    "live: calls a real LLM (opt-in, never in CI)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
