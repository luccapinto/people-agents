<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Doc"; src: url("file:///usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"); }
  @font-face { font-family: "Doc"; font-weight: bold; src: url("file:///usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"); }
  @page { size: A4; margin: 18mm 16mm 20mm; @bottom-center { content: "{{ brand.company.name }} — documento fictício gerado para demonstração · página " counter(page); font: 7.5pt "Doc"; color: #6b7280; } }
  body { font-family: "Doc"; font-size: 9.5pt; color: #111827; line-height: 1.45; }
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #4338ca; padding-bottom: 8px; margin-bottom: 14px; }
  .brand { font-size: 13pt; font-weight: bold; color: #312e81; }
  .muted { color: #6b7280; font-size: 8.5pt; }
  h1 { font-size: 15pt; margin: 0 0 4px; color: #111827; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; }
  th { text-align: left; background: #eef2ff; color: #312e81; font-size: 8.5pt; padding: 6px 8px; }
  td { padding: 5px 8px; border-bottom: 1px solid #e5e7eb; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tfoot td { font-weight: bold; border-top: 1.5px solid #312e81; border-bottom: none; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 24px; margin: 8px 0 12px; }
  .kv div { min-width: 40%; }
  .kv span { display: block; color: #6b7280; font-size: 8pt; }
  .box { border: 1px solid #c7d2fe; background: #f5f7ff; border-radius: 6px; padding: 10px 12px; margin: 12px 0; }
  .verify { margin-top: 24px; font-size: 8.5pt; color: #374151; }
  .sign { margin-top: 48px; border-top: 1px solid #9ca3af; width: 60%; padding-top: 4px; }
</style>
</head>
<body>
<header>
  <div><div class="brand">{{ brand.company.name }}</div><div class="muted">CNPJ {{ brand.company.cnpj }} · {{ brand.company.headquarters }}</div></div>
  <div class="muted">Emitido via {{ brand.productName }}</div>
</header>
{% block content %}{% endblock %}
</body>
</html>
